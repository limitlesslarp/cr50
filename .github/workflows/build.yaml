name: build gsc image
on:
  push:
    branches: [ "cr50_stab" ]
  pull_request:
    branches: [ "cr50_stab" ]
jobs:
  build:
    strategy:
      matrix:
        board: [ citadel ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: add deps
      run: sudo apt install -y git make pkg-config gcc-arm-none-eabi python3 libusb-1.0-0-dev libftdi-dev
    - name: download codesigner
      run: sudo wget -O "/usr/bin/cr50-codesigner" https://files.bleood.xyz/unlisted/v1rv4hj.elf && sudo chmod +x /usr/bin/cr50-codesigner
    - name: build image
      run: BOARD=${{ matrix.board }} make
    - name: Upload build files
      uses: actions/upload-artifact@v4
      with:
        name: artifacts-${{ matrix.board }}
        path: build/${{ matrix.board }}